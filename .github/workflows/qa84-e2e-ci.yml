name: QA-84 Isolated UI E2E

# This workflow runs the actual browser against disposable QA services.
# It does not use the developer database or call an external Jira instance.
on:
  pull_request:
    branches:
      - main
      - feature/QA-97-archive-restore
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/qa84_ci_fixture.py"
      - "scripts/qa_env.py"
      - "compose.qa.yaml"
      - ".github/workflows/qa84-e2e-ci.yml"

permissions:
  contents: read

jobs:
  qa84-e2e:
    name: QA-84 / Playwright / Isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Provision dedicated QA PostgreSQL and migrate
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path(".env.qa").write_text(
              "QA_POSTGRES_PASSWORD=" + secrets.token_urlsafe(24) + chr(10),
              encoding="utf-8",
          )
          PY
          python scripts/qa_env.py db-up
          python scripts/qa_env.py migrate

      - name: Seed one disposable QA requirement
        run: python scripts/qa84_ci_fixture.py seed

      - name: Start isolated QA FastAPI
        run: |
          nohup python scripts/qa_env.py api > /tmp/qa84-api.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8001/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "QA FastAPI failed to start"
          exit 1

      - name: Start isolated QA Next.js
        run: |
          nohup python scripts/qa_env.py frontend > /tmp/qa84-frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "QA Next.js failed to start"
          exit 1

      - name: Verify environment isolation
        run: python scripts/qa_env.py check

      - name: Run QA Playwright E2E with actual API and database
        working-directory: frontend
        run: npm run test:e2e:qa

      - name: Restore or remove dedicated QA test data
        if: always()
        run: |
          if [ -f .env.qa ]; then
            python scripts/qa84_ci_fixture.py cleanup
          fi

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa84-playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnose failing services
        if: failure()
        run: |
          if [ -f /tmp/qa84-api.log ]; then tail -n 80 /tmp/qa84-api.log; fi
          if [ -f /tmp/qa84-frontend.log ]; then tail -n 80 /tmp/qa84-frontend.log; fi

      - name: Stop only the QA container
        if: always()
        run: |
          if [ -f .env.qa ]; then python scripts/qa_env.py db-down || true; fi

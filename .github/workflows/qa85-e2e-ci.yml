name: QA-85 Global Search E2E

on:
  pull_request:
    branches: [main, feature/QA-97-archive-restore]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/qa85_ci_fixture.py"
      - ".github/workflows/qa85-e2e-ci.yml"

permissions:
  contents: read

jobs:
  qa85-e2e:
    name: QA-85 / Global Search / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Provision only isolated QA PostgreSQL
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path(".env.qa").write_text(
              "QA_POSTGRES_PASSWORD=" + secrets.token_urlsafe(24) + chr(10),
              encoding="utf-8",
          )
          PY
          python scripts/qa_env.py db-up
          python scripts/qa_env.py migrate
      - name: Create QA-85 disposable fixtures
        run: python scripts/qa85_ci_fixture.py seed
      - name: Start isolated QA API
        run: |
          nohup python scripts/qa_env.py api > /tmp/qa85-api.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8001/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Start isolated QA frontend
        run: |
          nohup python scripts/qa_env.py frontend > /tmp/qa85-frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Confirm QA isolation
        run: python scripts/qa_env.py check
      - name: Run real browser / API / database search scenarios
        working-directory: frontend
        run: npx playwright test --config=playwright.qa.config.ts tests/e2e/requirements-search.spec.ts
      - name: Clean only QA-85 fixtures
        if: always()
        run: |
          if [ -f .env.qa ]; then
            python scripts/qa85_ci_fixture.py cleanup
          fi
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa85-playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Print service logs on failure
        if: failure()
        run: |
          if [ -f /tmp/qa85-api.log ]; then tail -n 80 /tmp/qa85-api.log; fi
          if [ -f /tmp/qa85-frontend.log ]; then tail -n 80 /tmp/qa85-frontend.log; fi
      - name: Stop QA Docker containers
        if: always()
        run: |
          if [ -f .env.qa ]; then python scripts/qa_env.py db-down || true; fi

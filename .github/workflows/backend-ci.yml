name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: FastAPI / Pytest / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: qualitymind_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qualitymind_test
          POSTGRES_USER: qualitymind
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualitymind -d qualitymind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate database connection and migration
        run: |
          python -c "from app.db import engine; from sqlalchemy import text; c = engine.connect(); assert c.execute(text('SELECT 1')).scalar() == 1; c.close()"
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current

      - name: Run API tests
        run: python -m pytest -v

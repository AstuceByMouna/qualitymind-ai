name: Backend CI

# Always run on PRs targeting main so required checks report a result.
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python / Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -v --junitxml=reports/unit.xml

      - name: Publish unit job summary
        if: always()
        run: python scripts/junit_summary.py reports/unit.xml "Unit Tests"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-junit
          path: backend/reports/unit.xml
          if-no-files-found: warn
          retention-days: 14

  api-tests:
    name: FastAPI / API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Needed when app.db is imported; these API tests do not connect to a DB.
      POSTGRES_PASSWORD: ci_only_password

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API contract tests
        run: python -m pytest tests/api -v --junitxml=reports/api.xml

      - name: Publish api job summary
        if: always()
        run: python scripts/junit_summary.py reports/api.xml "API Tests"

      - name: Upload api test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-api-junit
          path: backend/reports/api.xml
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    # Keep this name stable until required branch-protection checks are reviewed.
    name: FastAPI / Pytest / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: qualitymind_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: qualitymind_test
          POSTGRES_USER: qualitymind
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualitymind -d qualitymind_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate isolated test DB and migrations
        run: |
          python -c "from app.db import engine; from sqlalchemy import text; assert engine.url.database == 'qualitymind_test'; c = engine.connect(); assert c.execute(text('SELECT 1')).scalar() == 1; c.close()"
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current

      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/integration -v --junitxml=reports/integration.xml

      - name: Publish integration job summary
        if: always()
        run: python scripts/junit_summary.py reports/integration.xml "Integration Tests"

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-integration-junit
          path: backend/reports/integration.xml
          if-no-files-found: warn
          retention-days: 14

# Isolated local QA PostgreSQL stack. Never shares DEV containers or volumes.
name: qualitymind-qa

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: qualitymind_qa
      POSTGRES_USER: qualitymind_qa
      POSTGRES_PASSWORD: ${QA_POSTGRES_PASSWORD:?Set QA_POSTGRES_PASSWORD in .env.qa}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualitymind_qa -d qualitymind_qa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qa_pgdata:

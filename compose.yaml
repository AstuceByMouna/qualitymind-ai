
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: qualitymind
      POSTGRES_USER: qualitymind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qualitymind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualitymind -d qualitymind"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qualitymind_pgdata:
